openapi: 3.0.3
info:
  title: EchoTalk API
  version: 0.1.0
  description: >
    EchoTalk 后台 OpenAPI 契约（三端对齐的唯一接口来源）。
    本批覆盖：账号(account) / 内容(content) / 系统(system) 三块；训练、会员/支付下一批补。
    响应统一信封 {code,msg,data,request_id} 与错误码规则见 docs/api-conventions.md。

servers:
  - url: /
    description: 健康检查在根路径
  - url: /api/v1
    description: 业务接口基址

tags:
  - name: system
    description: 系统/公共
  - name: account
    description: 账号体系
  - name: content
    description: 内容（App 端）
  - name: content-admin
    description: 内容管理（管理端）

security:
  - bearerAuth: []

paths:
  # ---------------- 系统 system ----------------
  /healthz:
    get:
      tags: [system]
      summary: 健康检查
      security: []
      servers:
        - url: /
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: ok }

  /system/config:
    get:
      tags: [system]
      summary: App 启动配置
      description: App 启动时拉取的全局配置（版本/协议/公告等）。
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SystemConfig" }

  /system/upload/token:
    post:
      tags: [system]
      summary: 获取媒体直传凭证
      description: 返回 COS 临时直传签名，App 录音上传与管理端内容上传共用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [biz, filename]
              properties:
                biz:
                  type: string
                  description: 业务场景
                  enum: [record, video, cover, subtitle]
                filename: { type: string, example: "abc.wav" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UploadToken" }
        "401": { $ref: "#/components/responses/Err401" }

  # ---------------- 账号 account ----------------
  /user/register:
    post:
      tags: [account]
      summary: 注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, code]
              properties:
                phone: { type: string, description: "中国大陆手机号", example: "13800138000" }
                password: { type: string, minLength: 6, maxLength: 32, example: "secret123" }
                nickname: { type: string, maxLength: 64, example: "dev" }
                code: { type: string, description: "验证码（内测固定码 123456）", example: "123456" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Err400" }

  /user/login:
    post:
      tags: [account]
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string, description: "中国大陆手机号", example: "13800138000" }
                password: { type: string }
      responses:
        "200":
          description: OK（业务失败如密码错误也返回 200，见 code）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/Err400" }

  /user/refresh:
    post:
      tags: [account]
      summary: 刷新令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Err401" }

  /user/logout:
    post:
      tags: [account]
      summary: 登出
      description: 撤销当前用户全部 refresh 会话（多端下线）。已签发的 access 令牌在其过期前仍有效。
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "401": { $ref: "#/components/responses/Err401" }

  /user/send-code:
    post:
      tags: [account]
      summary: 发送验证码（内测固定码）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: "中国大陆手机号", example: "13800138000" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "400": { $ref: "#/components/responses/Err400" }

  /user/profile:
    get:
      tags: [account]
      summary: 个人信息
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Err401" }
    put:
      tags: [account]
      summary: 更新昵称/头像
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 64 }
                avatar: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/Err400" }
        "401": { $ref: "#/components/responses/Err401" }

  # ---------------- 内容 content（App 端）----------------
  /content/videos:
    get:
      tags: [content]
      summary: 内容列表
      description: 分页 + 分类/难度筛选；返回付费锁标识 locked（服务端计算）。
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: category, in: query, schema: { type: string } }
        - { name: difficulty, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageData"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/VideoListItem" }

  /content/videos/{id}:
    get:
      tags: [content]
      summary: 内容详情
      description: 含字幕文件地址、HLS 播放地址、付费/解锁状态。
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/VideoDetail" }
        "404": { $ref: "#/components/responses/Err404" }

  # ---------------- 内容管理端 content-admin ----------------
  /admin/videos:
    get:
      tags: [content-admin]
      summary: 管理列表（含草稿/下架）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: status, in: query, description: "0草稿 1上架 2下架", schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageData"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/VideoDetail" }
        "401": { $ref: "#/components/responses/Err401" }
    post:
      tags: [content-admin]
      summary: 新增视频
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/VideoDetail" }
        "400": { $ref: "#/components/responses/Err400" }
        "401": { $ref: "#/components/responses/Err401" }

  /admin/videos/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [content-admin]
      summary: 编辑视频
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/VideoDetail" }
        "401": { $ref: "#/components/responses/Err401" }
        "404": { $ref: "#/components/responses/Err404" }
    delete:
      tags: [content-admin]
      summary: 删除视频（软删）
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "401": { $ref: "#/components/responses/Err401" }
        "404": { $ref: "#/components/responses/Err404" }

  /admin/videos/{id}/status:
    patch:
      tags: [content-admin]
      summary: 上下架 / 免费付费切换
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: integer, description: "0草稿 1上架 2下架" }
                is_free: { type: boolean, description: "是否免费" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/VideoDetail" }
        "401": { $ref: "#/components/responses/Err401" }
        "404": { $ref: "#/components/responses/Err404" }

  # ---------------- 训练 / 评测 training ----------------
  /training/evaluate:
    post:
      tags: [training]
      summary: 上传录音评测
      description: >
        上传一段录音（16K/16bit/单声道 WAV）+ 句子文本，经 speech 网关送讯飞 ISE 评测，
        返回总分及发音/流利度/完整度/词级，并落库训练记录。
        讯飞不可用时降级兜底：返回 degraded=true、分数置 0、带提示语，HTTP 仍为 200。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, video_id, text]
              properties:
                audio:
                  type: string
                  format: binary
                  description: "录音文件，16K/16bit/单声道 WAV，上限 8MB"
                video_id: { type: integer, format: int64, description: "所属视频ID" }
                sentence_index: { type: integer, description: "句在字幕文件中的序号，与字幕 seq 对齐" }
                text: { type: string, maxLength: 512, description: "评测试题文本=句子英文" }
      responses:
        "200":
          description: OK（含降级结果）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/EvaluateResult" }
        "400": { $ref: "#/components/responses/Err400" }
        "401": { $ref: "#/components/responses/Err401" }

  /training/records:
    get:
      tags: [training]
      summary: 训练历史
      description: 按当前用户分页返回训练（评测）记录，新到旧。
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageData"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/TrainingRecordItem" }
        "401": { $ref: "#/components/responses/Err401" }

  # ---------------- 会员与支付 payment ----------------
  /payment/products:
    get:
      tags: [payment]
      summary: 商品(SKU)列表
      description: 返回全部上架商品（按 sort 倒序），供付费墙展示。需登录。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ProductItem" }
        "401": { $ref: "#/components/responses/Err401" }

  /payment/membership:
    get:
      tags: [payment]
      summary: 当前用户会员状态
      description: 个人中心展示。有效性实时按到期时间判定，过期即 is_member=false。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MembershipStatusResponse" }
        "401": { $ref: "#/components/responses/Err401" }

  /payment/orders:
    post:
      tags: [payment]
      summary: 下单（创建待支付订单）
      description: >
        按 product_id 创建待支付订单，价格与会员时长在下单时从商品快照；返回订单号与唤起支付参数(mock占位)。
        此步不开会员（开会员在确认步）。业务失败走 200 信封：商品不存在 14003、商品已下架 14004。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CreateOrderResponse" }
        "400": { $ref: "#/components/responses/Err400" }
        "401": { $ref: "#/components/responses/Err401" }

  /payment/orders/{order_no}/confirm:
    post:
      tags: [payment]
      summary: 模拟支付确认
      description: >
        模拟支付回调/确认：成功后订单置已支付并开通/续期会员（有效则到期日顺延，过期/新建则从现在起算）。
        已支付订单幂等返回当前会员态，不重复开会员。
        业务失败走 200 信封：订单不存在/非本人 14001、订单状态异常 14005、支付失败 14002。
      parameters:
        - { name: order_no, in: path, required: true, schema: { type: string }, description: "业务订单号" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ConfirmResponse" }
        "401": { $ref: "#/components/responses/Err401" }

  /admin/memberships/grant:
    post:
      tags: [payment-admin]
      summary: 手动发卡（运营）
      description: >
        给指定用户开/续会员（Source=Manual，无订单），开通/续期口径与订单确认一致。
        当前仅校验登录，角色校验留 Day6/7。业务失败走 200 信封：用户不存在 11001。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantMembershipRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/GrantResponse" }
        "400": { $ref: "#/components/responses/Err400" }
        "401": { $ref: "#/components/responses/Err401" }

  /admin/products:
    get:
      tags: [payment-admin]
      summary: SKU 管理列表（含下架）
      description: 分页列出商品（含下架，软删自动排除）；可按 status 过滤。当前仅校验登录，角色校验留后续。
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: status, in: query, description: "0下架 1上架", schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageData"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/AdminProductItem" }
        "401": { $ref: "#/components/responses/Err401" }
    post:
      tags: [payment-admin]
      summary: 新增 SKU
      description: 新建商品；不传 status 默认下架（0），运营确认后再上架。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminProductItem" }
        "400": { $ref: "#/components/responses/Err400" }
        "401": { $ref: "#/components/responses/Err401" }

  /admin/products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [payment-admin]
      summary: 编辑 SKU
      description: 业务失败走 200 信封：商品不存在 14003。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminProductItem" }
        "400": { $ref: "#/components/responses/Err400" }
        "401": { $ref: "#/components/responses/Err401" }
    delete:
      tags: [payment-admin]
      summary: 删除 SKU（软删）
      description: 软删商品（物理保留以供订单回显）。业务失败走 200 信封：商品不存在 14003。
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "401": { $ref: "#/components/responses/Err401" }

  /admin/products/{id}/status:
    patch:
      tags: [payment-admin]
      summary: SKU 上下架
      description: 切换上下架状态。业务失败走 200 信封：商品不存在 14003。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductStatusInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminProductItem" }
        "400": { $ref: "#/components/responses/Err400" }
        "401": { $ref: "#/components/responses/Err401" }

  /admin/orders:
    get:
      tags: [payment-admin]
      summary: 订单列表（管理端，只读）
      description: 分页列出订单，按 created_at 倒序；联表带用户邮箱与商品名。可按 status、user_id 过滤。当前仅校验登录，角色校验留后续。
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: status, in: query, description: "0待支付 1已支付 2已退款 3已关闭", schema: { type: integer } }
        - { name: user_id, in: query, description: "按用户过滤", schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageData"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/AdminOrderItem" }
        "401": { $ref: "#/components/responses/Err401" }

  /admin/memberships:
    get:
      tags: [payment-admin]
      summary: 会员列表（管理端，只读）
      description: >
        分页列出会员，按 expire_at 倒序；联表带用户邮箱。status 为实时有效性(按 expire_at 算)，
        过滤亦按实时值，沉睡过期用户也正确归为已过期。当前仅校验登录，角色校验留后续。
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: status, in: query, description: "实时有效性 0已过期/未生效 1有效", schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageData"
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: "#/components/schemas/AdminMembershipItem" }
        "401": { $ref: "#/components/responses/Err401" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # 统一响应信封
    Envelope:
      type: object
      required: [code, msg]
      properties:
        code: { type: integer, example: 0, description: "0=成功，非0见错误码表" }
        msg: { type: string, example: ok }
        data: { description: "业务数据，失败时省略" }
        request_id: { type: string, example: "a1b2c3d4" }

    PageData:
      type: object
      properties:
        list: { type: array, items: {} }
        total: { type: integer, format: int64, example: 120 }
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 20 }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }

    User:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        phone: { type: string, description: "手机号(注册/登录 identifier)", example: "13800138000" }
        email: { type: string, description: "邮箱(保留备用，可空)" }
        nickname: { type: string }
        status: { type: integer, description: "1正常 0禁用" }
        created_at: { type: string, format: date-time }

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            avatar: { type: string }

    VideoListItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        cover_url: { type: string }
        duration: { type: integer, description: "秒" }
        difficulty: { type: integer, description: "1-5" }
        category: { type: string }
        is_free: { type: boolean }
        locked: { type: boolean, description: "服务端计算：当前用户是否被付费墙拦住" }

    VideoDetail:
      allOf:
        - $ref: "#/components/schemas/VideoListItem"
        - type: object
          properties:
            description: { type: string }
            hls_url: { type: string, description: "HLS 播放地址（locked=true 时可能为空）" }
            subtitle_en_url: { type: string, description: "英文字幕文件地址（含句级时间戳）" }
            subtitle_cn_url: { type: string, description: "中文字幕文件地址" }
            status: { type: integer, description: "0草稿 1上架 2下架" }

    VideoInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 512 }
        cover_url: { type: string }
        hls_url: { type: string }
        subtitle_en_url: { type: string }
        subtitle_cn_url: { type: string }
        duration: { type: integer }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        category: { type: string }
        is_free: { type: boolean }
        sort: { type: integer }

    SystemConfig:
      type: object
      properties:
        latest_version: { type: string, example: "1.0.0" }
        min_version: { type: string, example: "1.0.0" }
        force_update: { type: boolean }
        agreement_url: { type: string }
        privacy_url: { type: string }
        notice: { type: string, description: "公告，可空" }
        contact: { type: string, description: "客服联系方式" }

    UploadToken:
      type: object
      description: COS 直传所需的临时凭证（字段随接入实现细化）。
      properties:
        provider: { type: string, example: cos }
        bucket: { type: string }
        region: { type: string }
        key: { type: string, description: "对象 key" }
        token: { type: string, description: "临时签名/凭证" }
        expire_at: { type: string, format: date-time }
        cdn_base: { type: string, description: "回放用 CDN 域名前缀" }

    WordScore:
      type: object
      properties:
        word: { type: string }
        score: { type: number, format: float, description: "单词级评分" }

    EvaluateResult:
      type: object
      properties:
        record_id: { type: integer, format: int64, description: "落库后的训练记录ID" }
        overall: { type: number, format: float, description: "总分" }
        accuracy: { type: number, format: float, description: "发音准确度" }
        fluency: { type: number, format: float, description: "流利度" }
        integrity: { type: number, format: float, description: "完整度" }
        words:
          type: array
          items: { $ref: "#/components/schemas/WordScore" }
        degraded: { type: boolean, description: "讯飞不可用时的降级兜底结果（分数为0）" }
        message: { type: string, description: "降级等情形的提示语，正常时省略" }

    TrainingRecordItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        video_id: { type: integer, format: int64 }
        sentence_index: { type: integer, description: "句在字幕文件中的序号" }
        sentence_text: { type: string }
        overall_score: { type: number, format: float }
        accuracy_score: { type: number, format: float }
        fluency_score: { type: number, format: float }
        integrity_score: { type: number, format: float }
        degraded: { type: boolean }
        created_at: { type: string, format: date-time }

    # ---- 会员与支付 payment（按真实出入参 DTO，非 GORM 模型）----
    ProductItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: "商品名称" }
        description: { type: string }
        price: { type: integer, format: int64, description: "现价(分)" }
        original_price: { type: integer, format: int64, description: "原价(分)" }
        duration_days: { type: integer, description: "会员时长(天)" }
        type: { type: integer, description: "商品类型 1订阅 2内容包" }

    AdminProductItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: "商品名称" }
        description: { type: string }
        price: { type: integer, format: int64, description: "现价(分)" }
        original_price: { type: integer, format: int64, description: "原价(分)" }
        duration_days: { type: integer, description: "会员时长(天)" }
        type: { type: integer, description: "商品类型 1订阅 2内容包" }
        status: { type: integer, description: "上下架状态 0下架 1上架" }
        sort: { type: integer, description: "排序权重" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminOrderItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        order_no: { type: string, description: "业务订单号" }
        user_id: { type: integer, format: int64 }
        phone: { type: string, description: "用户手机号(联表)" }
        product_id: { type: integer, format: int64 }
        product_name: { type: string, description: "商品名(联表，软删商品仍回显)" }
        amount: { type: integer, format: int64, description: "金额(分)" }
        duration_days: { type: integer, description: "会员时长(天)" }
        channel: { type: string, description: "支付渠道 mock/wechat/alipay" }
        status: { type: integer, description: "订单状态 0待支付 1已支付 2已退款 3已关闭" }
        paid_at: { type: string, format: date-time, description: "支付时间(未支付为空)" }
        created_at: { type: string, format: date-time }

    AdminMembershipItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        phone: { type: string, description: "用户手机号(联表)" }
        status: { type: integer, description: "实时有效性 0已过期/未生效 1有效(按expire_at算)" }
        start_at: { type: string, format: date-time }
        expire_at: { type: string, format: date-time }
        source: { type: integer, description: "开通来源 1订单 2手动发卡" }
        last_order_id: { type: integer, format: int64, description: "最近订单ID" }
        created_at: { type: string, format: date-time }

    ProductInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64, description: "商品名称(必填)" }
        description: { type: string, maxLength: 255 }
        price: { type: integer, format: int64, minimum: 0, description: "现价(分)" }
        original_price: { type: integer, format: int64, minimum: 0, description: "原价(分)" }
        duration_days: { type: integer, minimum: 0, description: "会员时长(天，订阅型应>0)" }
        type: { type: integer, enum: [1, 2], description: "商品类型 1订阅 2内容包(0时默认1)" }
        status: { type: integer, enum: [0, 1], description: "上下架 0下架 1上架(不传默认下架)" }
        sort: { type: integer, description: "排序权重" }

    ProductStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: integer, enum: [0, 1], description: "目标状态 0下架 1上架" }

    CreateOrderRequest:
      type: object
      required: [product_id]
      properties:
        product_id: { type: integer, format: int64, description: "商品ID" }

    CreateOrderResponse:
      type: object
      properties:
        order_no: { type: string, description: "业务订单号(确认支付时回传)" }
        product_id: { type: integer, format: int64 }
        amount: { type: integer, format: int64, description: "应付金额(分)" }
        status: { type: integer, description: "订单状态 0待支付" }
        pay_payload: { type: string, description: "客户端唤起支付所需参数(mock占位)" }

    MembershipInfo:
      type: object
      properties:
        status: { type: integer, description: "会员状态 0未生效/已过期 1有效" }
        start_at: { type: string, format: date-time }
        expire_at: { type: string, format: date-time }

    ConfirmResponse:
      type: object
      properties:
        order_no: { type: string }
        status: { type: integer, description: "订单状态 1已支付" }
        membership: { $ref: "#/components/schemas/MembershipInfo" }

    MembershipStatusResponse:
      type: object
      properties:
        is_member: { type: boolean, description: "当前是否有效会员(实时按到期时间)" }
        status: { type: integer, description: "会员状态 0非会员/已过期 1有效" }
        start_at: { type: string, format: date-time, description: "无会员为零值" }
        expire_at: { type: string, format: date-time, description: "无会员为零值，过期则为过去时间" }

    GrantMembershipRequest:
      type: object
      required: [user_id, duration_days]
      properties:
        user_id: { type: integer, format: int64, description: "目标用户ID" }
        duration_days: { type: integer, minimum: 1, description: "发卡时长(天)" }

    GrantResponse:
      type: object
      properties:
        user_id: { type: integer, format: int64 }
        membership: { $ref: "#/components/schemas/MembershipInfo" }

  responses:
    OK:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Err400:
      description: 参数错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 10400, msg: "手机号格式不正确", request_id: "a1b2c3d4" }
    Err401:
      description: 未授权/登录失效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 10401, msg: "未授权或登录失效", request_id: "a1b2c3d4" }
    Err403:
      description: 无访问权限
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 10403, msg: "无访问权限", request_id: "a1b2c3d4" }
    Err404:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 10404, msg: "资源不存在", request_id: "a1b2c3d4" }
    Err500:
      description: 服务器内部错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 10500, msg: "服务器内部错误", request_id: "a1b2c3d4" }
