# EchoTalk 后台配置示例。复制为 config.yaml 后填入本地值。
# 敏感项（密码 / 密钥）建议留空，改用环境变量覆盖：前缀 ECHOTALK_，分隔符 _
#   例：mysql.dsn -> ECHOTALK_MYSQL_DSN

server:
  port: 8080
  mode: debug            # debug / release

mysql:
  dsn: "user:pass@tcp(127.0.0.1:3306)/echotalk?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 1h

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

jwt:
  secret: "change-me-in-env"   # 生产用 ECHOTALK_JWT_SECRET 覆盖
  issuer: "echotalk"
  access_ttl: 2h
  refresh_ttl: 720h

iflytek:
  app_id: ""
  api_key: ""
  api_secret: ""
  ise_host: "ise-api.xfyun.cn"

cos:
  bucket: ""
  region: "ap-guangzhou"
  secret_id: ""
  secret_key: ""

log:
  level: "info"            # debug / info / warn / error
  format: "console"        # console(本地易读) / json(生产采集)
